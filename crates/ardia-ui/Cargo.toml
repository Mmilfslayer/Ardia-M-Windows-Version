[package]
name = "ardia-ui"
version = "0.1.0"
edition = "2021"
description = "Tauri UI layer for Ardia Windows"

[dependencies]
# Workspace dependencies
webview2 = { workspace = true }
webview2-com = { workspace = true }
windows = { workspace = true }
windows-result = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
config = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
aes-gcm = { workspace = true }
pbkdf2 = { workspace = true }
zeroize = { workspace = true }
rusqlite = { workspace = true }

# Tauri
tauri = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-sql = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-updater = { workspace = true }

# Ardia core
ardia-core = { path = "../ardia-core" }
ardia-webview2 = { path = "../ardia-webview2" }

# Utilities
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "5.5"
tauri-plugin-log = { version = "2.0", features = ["tracing"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true