name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: "cargo-${{ hashFiles('**/Cargo.lock') }}"
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile
        working-directory: crates/ardia-ui/ui

      - name: Build Rust workspace
        run: cargo build --release --workspace --locked
        shell: pwsh

      - name: Build UI (TypeScript/React)
        run: pnpm run build
        working-directory: crates/ardia-ui/ui

      - name: Verify binary exists
        run: |
          $binary = "crates/ardia-ui/target/x86_64-pc-windows-msvc/release/ardia.exe"
          if (Test-Path $binary) {
            $size = (Get-Item $binary).Length / 1MB
            Write-Host "Binary found: $binary ($([math]::Round($size, 2)) MB)"
          } else {
            Write-Error "Binary not found at $binary"
            exit 1
          }
        shell: pwsh

      - name: Create release archive
        run: |
          $version = "${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}"
          $version = $version.TrimStart('v')
          $outDir = "release-out"
          New-Item -ItemType Directory -Force -Path $outDir
          Copy-Item "crates/ardia-ui/target/x86_64-pc-windows-msvc/release/ardia.exe" "$outDir/Ardia-$version-windows-x64.exe"
          Compress-Archive -Path "$outDir/*" -DestinationPath "Ardia-$version-windows-x64.zip"
        shell: pwsh

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: Ardia-${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}-windows-x64
          path: Ardia-*.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: Ardia-${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}-windows-x64
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}
          name: Ardia ${{ github.event.inputs.version != '' && github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}