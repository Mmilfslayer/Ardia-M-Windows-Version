[workspace]
members = [
    "crates/ardia-core",
    "crates/ardia-ui",
    "crates/ardia-webview2",
]
resolver = "2"

[workspace.dependencies]
# WebView2 - use the official Microsoft crate
webview2 = { version = "0.56", features = ["webview2_1_0_3065_40"] }
webview2-com = { version = "0.56", features = ["webview2_1_0_3065_40"] }

# Windows APIs via windows-rs
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_Networking_WinHttp",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-result = "0.58"

# Tauri for UI integration
tauri = { version = "2.0", features = ["custom-protocol", "tray-icon", "clipboard-manager", "fs", "dialog", "shell", "updater"] }
tauri-plugin-store = "2.0"
tauri-plugin-sql = { version = "2.0", features = ["rusqlite", "sqlcipher"] }
tauri-plugin-clipboard = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-updater = "2.0"

# Database
rusqlite = { version = "0.31", features = ["bundled", "vtab", "extra_check"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "macros"] }

# Async
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Config
config = "0.14"
dirs = "5.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
percent-encoding = "2.3"

# Crypto (for passwords - Windows DPAPI)
aes-gcm = "0.10"
pbkdf2 = "0.12"
zeroize = "1.8"

# IPC
tauri-ipc = "2.0"

# Testing
mockall = { version = "0.13", features = ["nightly"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"